openapi: 3.0.3
info:
  title: 실시간 채팅 앱 API
  description: |
    실시간 채팅 애플리케이션을 위한 HTTP API 명세서입니다.

    주요 실시간 통신은 Socket.IO를 통해 이루어지며, 이 API는 초기 데이터 로딩과
    비실시간 작업을 위해 사용됩니다.

    ## 인증
    실험용 애플리케이션으로 복잡한 인증은 구현하지 않습니다.
    세션 ID를 통한 간단한 세션 관리만 수행합니다.

    ## 실시간 통신
    채팅 메시지 전송, 방 참여/퇴장, 사용자 상태 변경 등은 Socket.IO를 통해 처리됩니다.
    Socket.IO 이벤트 명세는 별도의 `socket-events.ts` 파일을 참조하세요.
  version: 1.0.0
  contact:
    name: 실시간 채팅 앱
    email: support@chat-app.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3001/api
    description: 로컬 개발 서버
  - url: https://api.chat-app.com/api
    description: 프로덕션 서버 (향후)

# =============================================================================
# 태그 정의
# =============================================================================

tags:
  - name: nickname
    description: 닉네임 생성 및 검증 API
  - name: rooms
    description: 채팅방 정보 조회 API
  - name: session
    description: 세션 관리 API (실험용)
  - name: server
    description: 서버 상태 및 통계 API

# =============================================================================
# API 경로 정의
# =============================================================================

paths:
  # ---------------------------------------------------------------------------
  # 닉네임 관련 API
  # ---------------------------------------------------------------------------

  /nickname/random:
    get:
      tags: [nickname]
      summary: 랜덤 닉네임 생성
      description: 형용사+명사 조합의 랜덤 닉네임을 생성합니다.
      responses:
        200:
          description: 랜덤 닉네임 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          nickname:
                            type: string
                            example: "친절한고양이"
                            description: "생성된 랜덤 닉네임"
        500:
          $ref: '#/components/responses/InternalServerError'

  /nickname/validate:
    post:
      tags: [nickname]
      summary: 닉네임 유효성 검증
      description: 입력된 닉네임이 규칙에 맞는지 검증합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nickname
              properties:
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 20
                  example: "사용자닉네임"
                  description: "검증할 닉네임"
      responses:
        200:
          description: 닉네임 검증 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          isValid:
                            type: boolean
                            description: "닉네임 유효성 여부"
                          errors:
                            type: array
                            items:
                              type: string
                            description: "유효하지 않은 경우 에러 메시지 목록"
                            example: ["닉네임은 1-20자여야 합니다", "특수문자는 사용할 수 없습니다"]
        400:
          $ref: '#/components/responses/BadRequest'

  # ---------------------------------------------------------------------------
  # 채팅방 관련 API
  # ---------------------------------------------------------------------------

  /rooms:
    get:
      tags: [rooms]
      summary: 활성 채팅방 목록 조회
      description: 현재 활성화된 채팅방들의 목록을 최신 활동 순으로 반환합니다.
      responses:
        200:
          description: 채팅방 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          rooms:
                            type: array
                            items:
                              $ref: '#/components/schemas/RoomSummary'

  /rooms/{roomId}:
    get:
      tags: [rooms]
      summary: 채팅방 상세 정보 조회
      description: 특정 채팅방의 상세 정보를 조회합니다.
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 채팅방 ID
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        200:
          description: 채팅방 정보 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          room:
                            $ref: '#/components/schemas/RoomDetail'
        404:
          $ref: '#/components/responses/NotFound'

  /rooms/{roomId}/messages:
    get:
      tags: [rooms]
      summary: 채팅방 메시지 히스토리 조회
      description: 특정 채팅방의 메시지 히스토리를 페이지네이션으로 조회합니다.
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 채팅방 ID
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: 한 번에 조회할 메시지 수
        - name: before
          in: query
          schema:
            type: string
            format: uuid
          description: 특정 메시지 ID 이전의 메시지들만 조회
      responses:
        200:
          description: 메시지 히스토리 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MessageSummary'
        404:
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # 세션 관리 API
  # ---------------------------------------------------------------------------

  /session/create:
    post:
      tags: [session]
      summary: 새 세션 생성
      description: 새로운 사용자 세션을 생성합니다. 닉네임이 제공되지 않으면 랜덤 생성됩니다.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  minLength: 1
                  maxLength: 20
                  description: "사용할 닉네임 (선택사항)"
                  example: "사용자123"
      responses:
        201:
          description: 세션 생성 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessionId:
                            type: string
                            format: uuid
                            description: "생성된 세션 ID"
                          user:
                            $ref: '#/components/schemas/UserSummary'
                          expiresAt:
                            type: string
                            format: date-time
                            description: "세션 만료 시간"
        400:
          $ref: '#/components/responses/BadRequest'

  /session/validate:
    get:
      tags: [session]
      summary: 세션 유효성 검사
      description: 제공된 세션 ID의 유효성을 검사합니다.
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: "검증할 세션 ID"
      responses:
        200:
          description: 세션 유효성 검사 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          isValid:
                            type: boolean
                            description: "세션 유효성 여부"
                          user:
                            $ref: '#/components/schemas/UserSummary'
        400:
          $ref: '#/components/responses/BadRequest'

  /session/{sessionId}:
    delete:
      tags: [session]
      summary: 세션 삭제
      description: 지정된 세션을 삭제합니다.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: "삭제할 세션 ID"
      responses:
        204:
          description: 세션 삭제 성공
        404:
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # 서버 상태 API
  # ---------------------------------------------------------------------------

  /health:
    get:
      tags: [server]
      summary: 서버 상태 확인
      description: 서버의 현재 상태와 기본 메트릭을 반환합니다.
      responses:
        200:
          description: 서버 상태 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthStatus'
        503:
          description: 서비스 이용 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /stats:
    get:
      tags: [server]
      summary: 서버 통계 정보
      description: 서버의 상세 통계 정보를 반환합니다.
      responses:
        200:
          description: 서버 통계 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ServerStats'

# =============================================================================
# 컴포넌트 정의
# =============================================================================

components:
  # ---------------------------------------------------------------------------
  # 공통 스키마
  # ---------------------------------------------------------------------------

  schemas:
    ApiResponse:
      type: object
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          description: "API 호출 성공 여부"
        message:
          type: string
          description: "응답 메시지"
        timestamp:
          type: string
          format: date-time
          description: "응답 생성 시간"

    ApiError:
      type: object
      required:
        - success
        - error
        - message
        - statusCode
        - timestamp
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
          description: "에러 코드"
        message:
          type: string
          description: "에러 메시지"
        statusCode:
          type: integer
          description: "HTTP 상태 코드"
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          description: "에러가 발생한 API 경로"

    PaginatedResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            pagination:
              type: object
              properties:
                page:
                  type: integer
                  minimum: 1
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                total:
                  type: integer
                  minimum: 0
                totalPages:
                  type: integer
                  minimum: 0

    # ---------------------------------------------------------------------------
    # 사용자 관련 스키마
    # ---------------------------------------------------------------------------

    UserSummary:
      type: object
      required:
        - id
        - nickname
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: "사용자 고유 ID"
        nickname:
          type: string
          minLength: 1
          maxLength: 20
          description: "사용자 닉네임"
          example: "친절한고양이"
        createdAt:
          type: string
          format: date-time
          description: "사용자 생성 시간"
        currentRoomId:
          type: string
          format: uuid
          nullable: true
          description: "현재 참여 중인 방 ID"
        lastSeen:
          type: string
          format: date-time
          description: "마지막 활동 시간"

    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            isConnected:
              type: boolean
              description: "실시간 연결 상태"
            joinedAt:
              type: string
              format: date-time
              description: "방 입장 시간 (방 참여자 조회 시에만 포함)"

    # ---------------------------------------------------------------------------
    # 채팅방 관련 스키마
    # ---------------------------------------------------------------------------

    RoomSummary:
      type: object
      required:
        - id
        - name
        - participantCount
        - maxParticipants
        - participants
        - lastActivity
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: "채팅방 고유 ID"
        name:
          type: string
          description: "채팅방 이름"
          example: "채팅방 #001"
        participantCount:
          type: integer
          minimum: 0
          maximum: 5
          description: "현재 참여자 수"
        maxParticipants:
          type: integer
          enum: [5]
          description: "최대 참여자 수"
        participants:
          type: array
          items:
            type: string
          maxItems: 5
          description: "참여자 닉네임 목록"
          example: ["친절한고양이", "빠른토끼", "똑똑한펭귄"]
        lastActivity:
          type: string
          format: date-time
          description: "마지막 활동 시간 (정렬 기준)"
        createdAt:
          type: string
          format: date-time
          description: "채팅방 생성 시간"

    RoomDetail:
      allOf:
        - $ref: '#/components/schemas/RoomSummary'
        - type: object
          properties:
            participants:
              type: array
              items:
                $ref: '#/components/schemas/UserDetail'
              maxItems: 5
              description: "참여자 상세 정보 목록"
            createdBy:
              type: string
              format: uuid
              description: "방 생성자 사용자 ID"

    # ---------------------------------------------------------------------------
    # 메시지 관련 스키마
    # ---------------------------------------------------------------------------

    MessageSummary:
      type: object
      required:
        - id
        - content
        - authorId
        - authorNickname
        - createdAt
        - type
      properties:
        id:
          type: string
          format: uuid
          description: "메시지 고유 ID"
        content:
          type: string
          maxLength: 500
          description: "메시지 내용"
        authorId:
          type: string
          format: uuid
          description: "작성자 사용자 ID"
        authorNickname:
          type: string
          description: "작성자 닉네임 (전송 시점 스냅샷)"
          example: "친절한고양이"
        createdAt:
          type: string
          format: date-time
          description: "메시지 생성 시간"
        type:
          type: string
          enum: [chat, system, notification]
          description: "메시지 타입"
          example: "chat"

    # ---------------------------------------------------------------------------
    # 서버 상태 관련 스키마
    # ---------------------------------------------------------------------------

    HealthStatus:
      type: object
      required:
        - status
        - version
        - uptime
        - memory
        - connections
        - rooms
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          description: "서버 전체 상태"
        version:
          type: string
          description: "애플리케이션 버전"
          example: "1.0.0"
        uptime:
          type: number
          description: "서버 가동 시간 (초)"
        memory:
          type: object
          properties:
            used:
              type: number
              description: "사용 중인 메모리 (바이트)"
            total:
              type: number
              description: "전체 메모리 (바이트)"
            percentage:
              type: number
              minimum: 0
              maximum: 100
              description: "메모리 사용률 (%)"
        connections:
          type: object
          properties:
            active:
              type: integer
              minimum: 0
              description: "활성 소켓 연결 수"
            total:
              type: integer
              minimum: 0
              description: "총 연결 수"
        rooms:
          type: object
          properties:
            active:
              type: integer
              minimum: 0
              description: "활성 채팅방 수"
            totalMessages:
              type: integer
              minimum: 0
              description: "전체 메시지 수"

    ServerStats:
      type: object
      properties:
        users:
          type: object
          properties:
            online:
              type: integer
              minimum: 0
              description: "현재 온라인 사용자 수"
            totalSessions:
              type: integer
              minimum: 0
              description: "총 생성된 세션 수"
        rooms:
          type: object
          properties:
            active:
              type: integer
              minimum: 0
              description: "활성 채팅방 수"
            totalCreated:
              type: integer
              minimum: 0
              description: "총 생성된 채팅방 수"
            totalDeleted:
              type: integer
              minimum: 0
              description: "자동 삭제된 채팅방 수"
            averageParticipants:
              type: number
              description: "평균 참여자 수"
        messages:
          type: object
          properties:
            totalSent:
              type: integer
              minimum: 0
              description: "총 전송된 메시지 수"
            messagesPerMinute:
              type: number
              minimum: 0
              description: "분당 메시지 전송량"
            averageLength:
              type: number
              minimum: 0
              description: "메시지 평균 길이"
        performance:
          type: object
          properties:
            responseTime:
              type: number
              minimum: 0
              description: "평균 응답 시간 (밀리초)"
            cpuUsage:
              type: number
              minimum: 0
              maximum: 100
              description: "CPU 사용률 (%)"
            memoryUsage:
              type: number
              minimum: 0
              maximum: 100
              description: "메모리 사용률 (%)"

  # ---------------------------------------------------------------------------
  # 공통 응답
  # ---------------------------------------------------------------------------

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            error: "VALIDATION_ERROR"
            message: "요청 데이터가 유효하지 않습니다"
            statusCode: 400
            timestamp: "2024-01-21T10:30:00.000Z"

    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            error: "NOT_FOUND"
            message: "요청한 리소스를 찾을 수 없습니다"
            statusCode: 404
            timestamp: "2024-01-21T10:30:00.000Z"

    InternalServerError:
      description: 내부 서버 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            success: false
            error: "INTERNAL_ERROR"
            message: "서버 내부 오류가 발생했습니다"
            statusCode: 500
            timestamp: "2024-01-21T10:30:00.000Z"