openapi: 3.0.3
info:
  title: Monorepo Workspace Management API
  description: |
    모노레포 환경의 워크스페이스, 프로젝트, 의존성을 관리하는 CLI 도구 API 스펙입니다.
    이는 내부 CLI 명령어들이 제공하는 기능들의 인터페이스를 정의합니다.
  version: 1.0.0

paths:
  /workspace/init:
    post:
      summary: 워크스페이스 초기화
      description: 빈 디렉토리에 pnpm + Turbo 모노레포 환경을 구축
      operationId: initWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 워크스페이스 이름
                  example: "@yourorg/monorepo"
                packageManager:
                  type: string
                  enum: ["pnpm"]
                  default: "pnpm"
                nodeVersion:
                  type: string
                  description: 최소 Node.js 버전
                  example: "18.17.0"
                includeConfig:
                  type: boolean
                  description: "@repo/config 패키지 포함 여부"
                  default: true
              required:
                - name
      responses:
        '200':
          description: 워크스페이스 초기화 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  workspace:
                    $ref: '#/components/schemas/Workspace'
                  message:
                    type: string
                    example: "Workspace initialized successfully"
        '400':
          description: 잘못된 요청 (이미 존재하는 워크스페이스 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workspace/status:
    get:
      summary: 워크스페이스 상태 조회
      description: 현재 워크스페이스의 전반적인 상태와 통계 정보를 반환
      operationId: getWorkspaceStatus
      responses:
        '200':
          description: 워크스페이스 상태 정보
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    $ref: '#/components/schemas/Workspace'
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectSummary'
                  statistics:
                    type: object
                    properties:
                      totalProjects:
                        type: integer
                        example: 8
                      appsCount:
                        type: integer
                        example: 3
                      packagesCount:
                        type: integer
                        example: 5
                      dependencyGraphHealth:
                        type: string
                        enum: ["healthy", "warning", "error"]
                        example: "healthy"

  /projects:
    get:
      summary: 프로젝트 목록 조회
      description: 워크스페이스 내 모든 프로젝트 목록과 기본 정보를 반환
      operationId: listProjects
      parameters:
        - name: type
          in: query
          description: 프로젝트 타입 필터
          schema:
            type: string
            enum: ["APP", "PACKAGE"]
        - name: status
          in: query
          description: 프로젝트 상태 필터
          schema:
            type: string
            enum: ["CREATED", "CONFIGURED", "BUILDING", "BUILT", "FAILED", "RUNNING"]
      responses:
        '200':
          description: 프로젝트 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'

    post:
      summary: 새 프로젝트 생성
      description: 워크스페이스에 새로운 앱 또는 패키지 프로젝트를 생성
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "@yourorg/new-app"
                type:
                  type: string
                  enum: ["APP", "PACKAGE"]
                template:
                  type: string
                  description: 사용할 프로젝트 템플릿
                  enum: ["nextjs", "vite-react", "node-api", "shared-lib"]
                dependencies:
                  type: array
                  items:
                    type: string
                  example: ["@repo/ui", "@repo/utils"]
              required:
                - name
                - type
      responses:
        '201':
          description: 프로젝트 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  project:
                    $ref: '#/components/schemas/Project'
        '400':
          description: 잘못된 요청 (중복된 이름, 잘못된 의존성 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{projectId}:
    get:
      summary: 프로젝트 상세 정보
      description: 특정 프로젝트의 상세 정보와 의존성을 반환
      operationId: getProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
          example: "yourorg-web-app"
      responses:
        '200':
          description: 프로젝트 상세 정보
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
                  buildTargets:
                    type: array
                    items:
                      $ref: '#/components/schemas/BuildTarget'
                  dependencies:
                    type: object
                    properties:
                      direct:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectSummary'
                      transitive:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectSummary'
        '404':
          description: 프로젝트를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /dependencies/graph:
    get:
      summary: 의존성 그래프 조회
      description: 전체 프로젝트의 의존성 그래프와 빌드 순서를 반환
      operationId: getDependencyGraph
      responses:
        '200':
          description: 의존성 그래프 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyGraph'

  /dependencies/validate:
    post:
      summary: 의존성 유효성 검증
      description: 순환 의존성과 버전 충돌을 검사
      operationId: validateDependencies
      responses:
        '200':
          description: 검증 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: ["circular_dependency", "version_conflict", "missing_dependency"]
                        severity:
                          type: string
                          enum: ["error", "warning"]
                        description:
                          type: string
                          example: "Circular dependency detected: @yourorg/app-a -> @yourorg/lib-b -> @yourorg/app-a"
                        affectedProjects:
                          type: array
                          items:
                            type: string

  /build:
    post:
      summary: 프로젝트 빌드 실행
      description: 지정된 프로젝트들을 의존성 순서에 따라 빌드
      operationId: buildProjects
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                projects:
                  type: array
                  items:
                    type: string
                  description: "빌드할 프로젝트 ID 목록. 빈 배열이면 모든 프로젝트 빌드"
                target:
                  type: string
                  enum: ["build", "dev", "test", "lint"]
                  default: "build"
                parallel:
                  type: boolean
                  description: "가능한 한 병렬 빌드 수행 여부"
                  default: true
                cache:
                  type: boolean
                  description: "Turbo 캐시 사용 여부"
                  default: true
      responses:
        '200':
          description: 빌드 완료 (성공 또는 실패 포함)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        projectId:
                          type: string
                        status:
                          type: string
                          enum: ["SUCCESS", "FAILED", "SKIPPED"]
                        duration:
                          type: integer
                          description: "빌드 소요 시간 (ms)"
                        cached:
                          type: boolean
                          description: "캐시에서 가져온 결과인지 여부"
                        logs:
                          type: string
                          description: "빌드 로그 (오류 발생 시)"

components:
  schemas:
    Workspace:
      type: object
      properties:
        name:
          type: string
          example: "@yourorg/monorepo"
        version:
          type: string
          example: "1.0.0"
        packageManager:
          type: string
          example: "pnpm@9.14.4"
        nodeVersion:
          type: string
          example: "18.17.0"
        workspacePatterns:
          type: array
          items:
            type: string
          example: ["apps/*", "packages/*"]
        status:
          type: string
          enum: ["INITIALIZING", "READY", "BUILDING", "ERROR"]
          example: "READY"
        rootPath:
          type: string
          example: "/Users/dev/my-monorepo"
      required:
        - name
        - packageManager
        - status

    Project:
      type: object
      properties:
        id:
          type: string
          example: "yourorg-web-app"
        name:
          type: string
          example: "@yourorg/web-app"
        type:
          type: string
          enum: ["APP", "PACKAGE"]
          example: "APP"
        location:
          type: string
          example: "apps/web"
        status:
          type: string
          enum: ["CREATED", "CONFIGURED", "BUILDING", "BUILT", "FAILED", "RUNNING"]
          example: "BUILT"
        dependencies:
          type: array
          items:
            type: string
          example: ["@repo/ui", "@repo/utils"]
        scripts:
          type: array
          items:
            type: string
          example: ["build", "dev", "test", "lint"]
        buildOutputPath:
          type: string
          example: "dist"
      required:
        - id
        - name
        - type
        - location
        - status

    ProjectSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        status:
          type: string
      required:
        - id
        - name
        - type
        - status

    SharedLibrary:
      type: object
      properties:
        name:
          type: string
          example: "@repo/ui"
        category:
          type: string
          enum: ["UI", "UTILS", "CONFIG", "TYPES"]
          example: "UI"
        exportedModules:
          type: array
          items:
            type: string
          example: ["Button", "Input", "Modal"]
        consumers:
          type: array
          items:
            type: string
          example: ["@yourorg/web-app", "@yourorg/admin-app"]
        version:
          type: string
          example: "1.0.0"
      required:
        - name
        - category
        - exportedModules

    DependencyGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              dependsOn:
                type: array
                items:
                  type: string
              dependents:
                type: array
                items:
                  type: string
        edges:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
              type:
                type: string
                enum: ["RUNTIME", "DEVTIME", "PEER"]
        topologicalOrder:
          type: array
          items:
            type: string
          description: "빌드 순서대로 정렬된 프로젝트 ID 목록"
        cycles:
          type: array
          items:
            type: array
            items:
              type: string
          description: "감지된 순환 의존성 목록"
      required:
        - nodes
        - edges
        - topologicalOrder

    BuildTarget:
      type: object
      properties:
        projectId:
          type: string
        name:
          type: string
          enum: ["build", "dev", "test", "lint"]
        dependencies:
          type: array
          items:
            type: string
          description: "선행되어야 할 다른 빌드 타겟"
        inputs:
          type: array
          items:
            type: string
          description: "빌드에 영향을 주는 입력 파일 패턴"
        outputs:
          type: array
          items:
            type: string
          description: "빌드 결과물 경로"
        cached:
          type: boolean
          description: "캐시 사용 여부"
        persistent:
          type: boolean
          description: "지속적 실행 여부 (dev 서버 등)"
      required:
        - projectId
        - name
        - cached
        - persistent

    Error:
      type: object
      properties:
        error:
          type: string
          example: "WORKSPACE_ALREADY_EXISTS"
        message:
          type: string
          example: "Workspace already exists in this directory"
        statusCode:
          type: integer
          example: 400
      required:
        - error
        - message
        - statusCode